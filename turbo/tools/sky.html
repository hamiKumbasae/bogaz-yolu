<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script></head>
<body><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';
import { Atmosphere, PRESETS } from '../src/atmosphere.js';
import { U } from '../src/shade.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const W = 800, H = 450;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping;
const s = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(60, W / H, 0.5, 12000);
const atm = new Atmosphere(r, s, 1);
const mat = new THREE.MeshStandardMaterial({ color: 0xd8cfc0, roughness: 0.85 });
for (let i = 0; i < 12; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(20, 10 + i * 4, 20), mat); const a = i / 12 * Math.PI * 2; b.position.set(Math.cos(a) * 120, 5 + i * 2, Math.sin(a) * 120); s.add(b); }
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x444446, roughness: 0.9 })); ground.position.y = 0.1; s.add(ground);
const car = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 16), new THREE.MeshPhysicalMaterial({ color: 0xc81d25, metalness: 0.55, roughness: 0.3, clearcoat: 1 })); car.position.set(0, 2, -12); s.add(car);
const comp = new EffectComposer(r, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType }));
comp.addPass(new RenderPass(s, cam)); comp.addPass(new OutputPass());
window.go = (preset, over, yaw) => {
  Object.assign(PRESETS[preset], over || {});
  const P = atm.set(preset, 'acik');
  r.toneMappingExposure = P.exposure;
  cam.position.set(0, 4, 0);
  const az = THREE.MathUtils.degToRad(P.azim) + (yaw || 0);
  cam.lookAt(Math.sin(az) * 100, 12, -Math.cos(az) * 100);
  car.position.set(Math.sin(az) * 12, 2, -Math.cos(az) * 12);
  atm.update(cam, new THREE.Vector3(), 0);
  comp.render();
  return atm.fogCol.toArray().map((x) => +x.toFixed(3));
};
window.ready = true;
</script></body></html>
