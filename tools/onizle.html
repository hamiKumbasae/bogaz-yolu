<!doctype html><meta charset="utf-8">
<style>
  @font-face { font-family: Fredoka; font-weight: 500; src: url(../src/fonts/fredoka-latin-500-normal.woff2); }
  @font-face { font-family: Fredoka; font-weight: 600; src: url(../src/fonts/fredoka-latin-600-normal.woff2); }
  @font-face { font-family: Fredoka; font-weight: 500; src: url(../src/fonts/fredoka-latin-ext-500-normal.woff2); unicode-range: U+0100-024F; }
  @font-face { font-family: Fredoka; font-weight: 600; src: url(../src/fonts/fredoka-latin-ext-600-normal.woff2); unicode-range: U+0100-024F; }
  body { margin: 0; background: #222; } canvas { display: block; }
</style>
<body>
<canvas id="c"></canvas>
<script src="../src/track.js"></script><script src="../src/core.js"></script><script src="../src/bot.js"></script>
<script src="../src/art.js"></script><script src="../src/endings.js"></script><script src="../src/render.js"></script>
<script>
// Geliştirme önizlemesi: ?s=3 ölçek. window.sprites(), sim(seed, secim, sn), ending(k), gate(), tower()
const S = +(new URLSearchParams(location.search).get('s') || 3);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
BY_ART.setScale(S);
function size(w, h) { cv.width = w * S; cv.height = h * S; ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = true; }
window.ready = document.fonts.load('600 10px Fredoka').then(() => document.fonts.load('500 10px Fredoka')).then(() => BY_ART.clearAll());
window.sprites = function () {
  size(384, 560);
  ctx.fillStyle = '#7ab0d8'; ctx.fillRect(0, 0, 384, 560);
  const ks = ['lamba','korkuluk','cinar','agac','servi','apartman','yali','cami','hisar','kale','saray','kiz_kulesi','tekne','vapur','balikci','simitci','durak','semsiye','kopru_kule','kopru_uzak','basla','kontrol','bitis',
    'sur','ayasofya','sultanahmet','galata_kulesi','camlica_kulesi','camlica_camii','bariyer','otoyol_lamba','ustgecit','tunel_agzi'];
  const ks2 = ['ahsap_ev','han','tas_bina','site','rezidans','plaza','reklam','balikekmek','misir_carsisi','kumpir','saat_kulesi','kruvaziyer'];
  let x = 2, y = 2, rowH = 0;
  const put = (img, maxH) => { const s = Math.min(1, maxH / img.lh, 90 / img.lw); const w = img.lw * s, h = img.lh * s; if (x + w > 382) { x = 2; y += rowH + 4; rowH = 0; } ctx.drawImage(img, x, y, w, h); x += w + 4; rowH = Math.max(rowH, h); };
  for (const k of ks) { const probe = BY_ART.sprite(k, { v: 3 }, 1); const s = Math.min(1, 64 / probe.lh, 90 / probe.lw); put(BY_ART.sprite(k, { v: 3 }, probe.lw * s * S), 64); }
  const A = BY_ART;
  for (const img of [A.player(0,false,'kirmizi'), A.player(-2,true,'kirmizi'), A.player(2,false,'turkuaz'), A.player(0,false,'beyaz'), A.car('araba',2,72*S), A.car('taksi',0,72*S), A.car('dolmus',0,84*S), A.car('otobus',0,116*S*0.7), A.car('kamyon',0,108*S*0.7), A.car('motor',0,32*S), A.car('metrobus',0,120*S*0.7), A.sprite('tabela',{label:'SARIYER 2 KM'},120*S), A.sprite('ayrim',{label:['BEBEK','KÖPRÜ']},150*S),
    A.sprite('levha',{label:['ÇAMLICA>ur','KADIKÖY E-5>u']},150*S), A.sprite('tunel_levha',{v:0},40*S), A.sprite('tunel_levha',{v:1},40*S)]) put(img, 70);
};
window.big = function (k, v) { size(384, 216); ctx.fillStyle = '#7ab0d8'; ctx.fillRect(0, 0, 384, 216); const p = BY_ART.sprite(k, { v: v || 0 }, 1); const s = Math.min(380 / p.lw, 210 / p.lh); const img = BY_ART.sprite(k, { v: v || 0 }, p.lw * s * S); ctx.drawImage(img, 2, 2, img.lw * s, img.lh * s); };
window.sim = function (seed, choices, secs, course) {
  size(384, 216);
  const G = BY.newRace({ seed, course }); const b = BY_BOT(choices);
  G.bgX = 0;
  const n = Math.round(secs * 60);
  for (let i = 0; i < n; i++) { const inp = b(G); BY.step(G, inp, 1 / 60); const s = BY.segAt(G, G.pos + BY.PLAYER_Z); G.bgX += s.curve * G.speed / BY.MAX * 0.6; if (G.result) break; }
  BY_RENDER.render(ctx, G, {});
  return { stage: BY_TRACK.STAGES[G.route[G.cur]].name, kmh: BY.kmh(G), phase: G.phase };
};
// Tur: n. etabın (1'den başlar) p. bölümünün frac oranına git ve çiz. carsOff: trafiği kaldır.
window.tur = function (n, p, frac, opts) {
  opts = opts || {};
  size(384, 216);
  const G = BY.newRace({ seed: opts.seed || 7, course: 'tur' }); const b = BY_BOT([0, 0, 0, 0, 0, 0, 0]); G.bgX = 0;
  for (let i = 0; i < 60 * 900 && G.cur < n - 1; i++) { BY.step(G, b(G), 1 / 60); }
  const st = BY.curStage(G), part = st.parts[p];
  const target = Math.floor(part.start + frac * (part.end - part.start));
  G.pos = target * BY.SEG - BY.PLAYER_Z - (opts.back || 0) * BY.SEG; G.px = G.track[target].cx + (opts.dx || 0) * BY.RW; G.cars = []; G.speed = BY.MAX * 0.6;
  G.t = opts.t || 0;
  // tramAt: n şerit ileride bir tramvay görünsün diye zamanı ayarla
  if (opts.tramAt) { const gap = 170 * BY.SEG, v = BY.MAX * 0.32, z0 = (target + opts.tramAt) * BY.SEG; G.t = (((z0 % gap) + gap) % gap) / v; }
  // önizleme için önde birkaç araç
  if (opts.traffic) {
    const kinds = ['araba', 'taksi', 'dolmus', 'otobus', 'araba', 'kamyon', 'taksi', 'motor'];
    for (let k = 0; k < opts.traffic; k++) {
      const kind = kinds[(k * 3 + (opts.seed || 7)) % kinds.length], D = BY.CARS[kind], lx = BY.LANE_X[(k * 2 + 1) % 3];
      G.cars.push({ kind, z: (target + 14 + k * 23) * BY.SEG, x: lx, tx: lx, speed: BY.MAX * 0.3, w: D.w, len: D.len, laneT: 99, color: k % 5 });
    }
  }
  for (let i = 0; i < (opts.steps || 0); i++) { const inp = b(G); BY.step(G, inp, 1 / 60); if (opts.carsOff) G.cars = []; }
  BY_RENDER.render(ctx, G, {});
  return { stage: BY_TRACK.STAGES[G.route[G.cur]].name, part: part.sea + '/' + part.land, kmh: BY.kmh(G), phase: G.phase, cars: G.cars.length };
};
window.ending = function (k) { size(384, 216); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(BY_ENDINGS.scene(k, '#d8302a'), 0, 0); };
window.gate = function () {
  size(384, 216);
  const G = BY.newRace({ seed: 4 }); const b = BY_BOT([1, 0, 0]); G.bgX = 0;
  for (let i = 0; i < 60 * 200; i++) { BY.step(G, b(G), 1 / 60); if (G.cur === 1) break; }
  const st = BY.curStage(G); G.pos = (st.gate - 22) * BY.SEG - BY.PLAYER_Z; G.cars = [];
  BY_RENDER.render(ctx, G, {});
};
window.tower = function () {
  size(384, 216);
  const G = BY.newRace({ seed: 4 }); const b = BY_BOT([0, 1, 1]); G.bgX = 0;
  for (let i = 0; i < 60 * 300; i++) { BY.step(G, b(G), 1 / 60); if (G.cur === 2) break; }
  const st = BY.curStage(G); let k = st.start; while (k < st.end && !G.track[k].sprites.some((s) => s.k === 'kopru_kule')) k++;
  G.pos = (k - 45) * BY.SEG - BY.PLAYER_Z; G.cars = []; G.px = G.track[k].cx;
  BY_RENDER.render(ctx, G, {});
  return k;
};
</script>
<script>
// semt çizimleri: her çeşidiyle
window.semt = function () {
  size(384, 600);
  ctx.fillStyle = '#7ab0d8'; ctx.fillRect(0, 0, 384, 600);
  const A = BY_ART; let x = 2, y = 2, rowH = 0;
  const put = (img, maxH) => { const s = Math.min(1, maxH / img.lh, 120 / img.lw); const w = img.lw * s, h = img.lh * s; if (x + w > 382) { x = 2; y += rowH + 4; rowH = 0; } ctx.drawImage(img, x, y, w, h); x += w + 4; rowH = Math.max(rowH, h); };
  const one = (k, sp, mh) => { const p = A.sprite(k, sp, 1); const s = Math.min(1, mh / p.lh, 120 / p.lw); put(A.sprite(k, sp, p.lw * s * S), mh); };
  for (let v = 0; v < 6; v++) one('ahsap_ev', { v }, 60);
  for (let v = 0; v < 3; v++) one('han', { v }, 70);
  for (let v = 0; v < 4; v++) one('tas_bina', { v }, 70);
  for (let v = 0; v < 2; v++) one('site', { v }, 80);
  for (let v = 0; v < 3; v++) one('rezidans', { v }, 90);
  one('plaza', { v: 1 }, 90);
  for (let v = 0; v < 5; v++) one('reklam', { v }, 44);
  one('iskele', { label: 'EMİNÖNÜ' }, 50); one('balikekmek', {}, 40); one('misir_carsisi', {}, 50); one('kumpir', {}, 40); one('saat_kulesi', {}, 70); one('kruvaziyer', {}, 40);
  put(A.car('tramvay', 0, 110 * S * 0.6), 60);
  for (let v = 0; v < 3; v++) one('kosk', { v }, 50);
  one('lale', {}, 24); one('yelkenli', {}, 50); one('kuleli', {}, 60); one('balik_lokantasi', {}, 44);
  put(A.car('polis', 0, 72 * S), 52); put(A.car('polis', 1, 72 * S), 52);
  for (let v = 0; v < 2; v++) put(A.car('polis_motor', v, 34 * S), 56);
  for (let v = 0; v < 3; v++) put(A.car('motosiklet', v, 34 * S), 56);
  for (let v = 0; v < 3; v++) put(A.car('scooter', v, 24 * S), 60);
  for (let v = 0; v < 3; v++) put(A.car('bisiklet', v, 26 * S), 60);
};
</script>
<script>
// Boğaz Yolu: idx etabına (0-9) git, gövdenin frac oranında çiz
window.bog = function (idx, frac, opts) {
  opts = opts || {};
  size(384, 216);
  const PATH = { 0: [], 1: [0], 2: [1], 3: [0, 0], 4: [0, 1], 5: [1, 1], 6: [0, 0, 0], 7: [0, 0, 1], 8: [1, 1, 0], 9: [1, 1, 1] };
  const G = BY.newRace({ seed: opts.seed || 7 }); const b = BY_BOT(PATH[idx].concat([0, 0, 0])); G.bgX = 0;
  for (let i = 0; i < 60 * 600 && G.route[G.cur] !== idx; i++) BY.step(G, b(G), 1 / 60);
  const st = BY.curStage(G);
  const target = Math.floor(st.start + frac * (st.bodyEnd - st.start));
  G.pos = target * BY.SEG - BY.PLAYER_Z; G.px = G.track[target].cx; G.cars = []; G.speed = BY.MAX * 0.6; G.t = opts.t || 0;
  if (opts.tramAt) { const gap = 170 * BY.SEG, v = BY.MAX * 0.32, z0 = (target + opts.tramAt) * BY.SEG; G.t = (((z0 % gap) + gap) % gap) / v; }
  if (opts.traffic) {
    const kinds = ['araba', 'taksi', 'dolmus', 'otobus', 'araba', 'kamyon'];
    for (let k = 0; k < opts.traffic; k++) { const kind = kinds[(k * 3 + 1) % kinds.length], D = BY.CARS[kind], lx = BY.LANE_X[(k * 2 + 1) % 3]; G.cars.push({ kind, z: (target + 14 + k * 23) * BY.SEG, x: lx, tx: lx, speed: BY.MAX * 0.3, w: D.w, len: D.len, laneT: 99, color: k % 5 }); }
  }
  // cars: [[tür, ileride kaç şerit, x], ...]
  for (const [kind, ahead, x, color] of opts.cars || []) { const D = BY.CARS[kind]; G.cars.push({ kind, z: (target + ahead) * BY.SEG, x, tx: x, speed: BY.MAX * 0.3, w: D.w, len: D.len, laneT: 99, color: color || 0, edge: !!D.edge, police: !!D.police }); }
  BY_RENDER.render(ctx, G, {});
  return BY_TRACK.STAGES[G.route[G.cur]].name;
};
</script>
