<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<canvas id="c" width="384" height="216" style="width:1152px;height:648px;image-rendering:pixelated"></canvas>
<script src="../src/track.js"></script><script src="../src/core.js"></script><script src="../src/bot.js"></script>
<script src="../src/art.js"></script><script src="../src/endings.js"></script><script src="../src/render.js"></script>
<script>
const ctx = document.getElementById('c').getContext('2d'); ctx.imageSmoothingEnabled = false;
window.sim = function (seed, choices, secs) {
  const G = BY.newRace({ seed }); const b = BY_BOT(choices);
  G.bgX = 0;
  const n = Math.round(secs * 60);
  for (let i = 0; i < n; i++) { const inp = b(G); BY.step(G, inp, 1 / 60); const s = BY.segAt(G, G.pos + BY.PLAYER_Z); G.bgX += s.curve * G.speed / BY.MAX * 0.6; if (G.result) break; }
  BY_RENDER.render(ctx, G, {});
  return { stage: BY_TRACK.STAGES[G.route[G.cur]].name, kmh: BY.kmh(G), phase: G.phase };
};
window.sprites = function () {
  ctx.fillStyle = '#7ab0d8'; ctx.fillRect(0, 0, 384, 216);
  const ks = ['lamba','korkuluk','cinar','agac','servi','apartman','yali','cami','hisar','kale','saray','kiz_kulesi','tekne','vapur','balikci','simitci','durak','semsiye','kopru_kule','kopru_uzak','basla','kontrol','bitis'];
  let x = 2, y = 2, rowH = 0;
  for (const k of ks) { const img = BY_ART.sprite(k, { v: 2 }); const s = Math.min(1, 64 / img.height, 90 / img.width); const w = img.width * s, h = img.height * s;
    if (x + w > 382) { x = 2; y += rowH + 4; rowH = 0; } ctx.drawImage(img, x, y, w, h); x += w + 4; rowH = Math.max(rowH, h); }
  const extra = [BY_ART.player(0,false,'kirmizi'), BY_ART.player(-2,true,'kirmizi'), BY_ART.player(2,false,'turkuaz'), BY_ART.car('araba',2), BY_ART.car('taksi',0), BY_ART.car('dolmus',0), BY_ART.car('otobus',0), BY_ART.car('kamyon',0), BY_ART.car('motor',0), BY_ART.sprite('tabela', {label:'SARIYER 2 KM'}), BY_ART.sprite('ayrim',{label:['BEBEK','KÖPRÜ']})];
  for (const img of extra) { const s = Math.min(1, 70 / img.height); const w = img.width * s, h = img.height * s; if (x + w > 382) { x = 2; y += rowH + 4; rowH = 0; } ctx.drawImage(img, x, y, w, h); x += w + 4; rowH = Math.max(rowH, h); }
};
</script>
<script>
window.ending = function (k) { ctx.drawImage(BY_ENDINGS.scene(k, '#d8302a'), 0, 0); };
window.gate = function () {
  const G = BY.newRace({ seed: 4 }); const b = BY_BOT([1, 0, 0]); G.bgX = 0;
  for (let i = 0; i < 60 * 200; i++) { BY.step(G, b(G), 1 / 60); if (G.cur === 1) break; }
  // kontrol kapısına 20 segment kala
  const st = BY.curStage(G); G.pos = (st.gate - 22) * BY.SEG - BY.PLAYER_Z; G.cars = [];
  BY_RENDER.render(ctx, G, {});
};
window.tower = function () {
  const G = BY.newRace({ seed: 4 }); const b = BY_BOT([0, 1, 1]); G.bgX = 0;
  for (let i = 0; i < 60 * 300; i++) { BY.step(G, b(G), 1 / 60); if (G.cur === 2) break; }
  const st = BY.curStage(G); let k = st.start; while (k < st.end && !G.track[k].sprites.some((s) => s.k === 'kopru_kule')) k++;
  G.pos = (k - 45) * BY.SEG - BY.PLAYER_Z; G.cars = []; G.px = G.track[k].cx;
  BY_RENDER.render(ctx, G, {});
  return k;
};
</script>
