# Testleri çalıştırır ve oyunları GitHub Pages'te yayınlar:
# https://hamikumbasae.github.io/bogaz-yolu/
# https://hamikumbasae.github.io/bogaz-yolu/turbo/  (İstanbul Turbo)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Çekirdek testleri
        run: node tests/core.test.js
      - name: Siteyi hazırla
        run: |
          mkdir _site
          cp -r index.html kumanda.html src _site/
          mkdir -p _site/turbo/data
          cp -r turbo/index.html turbo/src turbo/vendor _site/turbo/
          cp turbo/data/istanbul.json turbo/data/height.bin _site/turbo/data/
          sed -i "s/__V__/${GITHUB_SHA::8}/g" _site/turbo/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
