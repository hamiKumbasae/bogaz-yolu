<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10121c">
<meta name="description" content="Boğaz Yolu: İstanbul Boğazı'nın sahil yolunda süreye karşı yarış. Yol ayrımlarında Rumeli ya da Anadolu yakasını seç, dört farklı sona ulaş.">
<title>Boğaz Yolu</title>
<style>
  :root { --gece: #10121c; --metin: #ece6d6; --soluk: #9aa0b4; --sari: #f4c531; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--gece); color: var(--metin); font-family: system-ui, sans-serif; min-height: 100dvh;
    display: grid; place-items: start center; }
  main { width: min(100vw, 1100px); padding: 12px 16px 24px; }
  canvas#oyun { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; image-rendering: pixelated;
    touch-action: none; border-radius: 4px; }
  .dugmeler { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .dugmeler button { font: inherit; font-size: 14px; color: var(--metin); background: #222638; border: 1px solid #3a4058; border-radius: 6px;
    padding: 9px 14px; cursor: pointer; touch-action: manipulation; }
  .dugmeler button:hover { background: #2c3148; }
  .dugmeler button[aria-pressed="true"] { border-color: var(--sari); color: var(--sari); }
  button:focus-visible { outline: 2px solid var(--sari); outline-offset: 2px; }
  p.bilgi { color: var(--soluk); text-align: center; line-height: 1.7; margin: 14px 0 0; font-size: 14px; }
  kbd { font: 12px ui-monospace, monospace; background: #222638; border: 1px solid #3a4058; border-radius: 4px; padding: 1px 5px; color: var(--metin); }
  .dokunmatik { display: none; }

  /* Dokunmatik kumanda: yalnız dokunmatik ekranlarda. */
  .dokun { display: none; margin-top: 14px; justify-content: space-between; align-items: center; gap: 12px; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .dokun { display: flex; } p.bilgi { display: none; } .dokunmatik { display: inline-block; } }
  .grup { display: flex; gap: 10px; align-items: center; }
  .tus { touch-action: none; display: grid; place-items: center; color: #e8ecf6; font: 600 15px system-ui, sans-serif;
    background: #262b40; border: 2px solid #454c6c; border-radius: 14px; }
  .tus.basili { background: #3a4260; border-color: var(--sari); }
  .yon { width: min(22vw, 92px); height: min(22vw, 92px); font-size: 26px; }
  #tusGaz { width: min(24vw, 100px); height: min(24vw, 100px); background: #1f7a4a; border-color: #2fb36e; border-radius: 50%; }
  #tusFren { width: min(18vw, 76px); height: min(18vw, 76px); background: #7a2a2a; border-color: #c84e3e; border-radius: 50%; font-size: 13px; }
  body.egim .yon { opacity: 0.35; }

  /* Yatay telefon: oyun ortada, tuşlar iki yanda; ayar düğmeleri solda üstte. */
  @media (pointer: coarse) and (orientation: landscape) {
    body { overflow: hidden; }
    main { width: 100vw; height: 100dvh; padding: 6px max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
      display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: 1fr auto; align-items: center; gap: 6px 10px; }
    canvas#oyun { grid-column: 2; grid-row: 1 / span 2; height: calc(100dvh - 12px); width: auto; max-width: 60vw; }
    .dokun { display: contents; }
    .grup.sol { grid-column: 1; grid-row: 2; justify-content: center; }
    .grup.sag { grid-column: 3; grid-row: 1 / span 2; justify-content: center; flex-direction: column-reverse; }
    .yon { width: min(8vw, 64px); height: min(8vw, 64px); font-size: 22px; }
    #tusGaz { width: min(12vw, 96px); height: min(12vw, 96px); }
    #tusFren { width: min(9vw, 70px); height: min(9vw, 70px); }
    .dugmeler { grid-column: 1; grid-row: 1; align-self: start; margin: 0; flex-direction: column; align-items: stretch; gap: 3px; }
    .dugmeler button { padding: 3px 6px; font-size: 11px; opacity: 0.9; }
  }

  body.tv { overflow: hidden; }
  body.tv main { width: 100vw; height: 100vh; padding: 0; display: grid; place-items: center; }
  body.tv canvas#oyun { width: auto; height: 100vh; max-width: 100vw; border-radius: 0; }
  body.tv .dugmeler, body.tv p.bilgi, body.tv .dokun { display: none; }
</style>
</head>
<body>
<main>
  <canvas id="oyun" width="384" height="216" aria-label="Boğaz Yolu oyun alanı"></canvas>
  <div class="dokun" aria-label="Dokunmatik kumanda">
    <div class="grup sol">
      <div class="tus yon" id="tusSol" aria-label="Sola">◀</div>
      <div class="tus yon" id="tusSag" aria-label="Sağa">▶</div>
    </div>
    <div class="grup sag">
      <div class="tus" id="tusFren" aria-label="Fren">FREN</div>
      <div class="tus" id="tusGaz" aria-label="Gaz">GAZ</div>
    </div>
  </div>
  <div class="dugmeler">
    <button id="duraklat" type="button">Duraklat</button>
    <button id="ses" type="button">Ses</button>
    <button id="radyo" type="button">Radyo</button>
    <button id="egim" type="button" class="dokunmatik" aria-pressed="false">Eğerek sür</button>
    <button id="otoGaz" type="button" class="dokunmatik" aria-pressed="true">Otomatik gaz</button>
    <button id="tamEkran" type="button">Tam ekran</button>
  </div>
  <p class="bilgi"><kbd>←</kbd> <kbd>→</kbd> direksiyon · <kbd>↑</kbd> ya da <kbd>Z</kbd> gaz · <kbd>↓</kbd> ya da <kbd>X</kbd> fren · <kbd>R</kbd> radyo · <kbd>P</kbd> duraklat · <kbd>M</kbd> ses<br>
  Oyun kolu da çalışır. Telefonu direksiyon yapmak için menüden <b>Telefonla oyna</b> (<kbd>K</kbd>)</p>
</main>
<script src="src/track.js"></script>
<script src="src/core.js"></script>
<script src="src/bot.js"></script>
<script src="src/art.js"></script>
<script src="src/endings.js"></script>
<script src="src/render.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
<script src="src/remote.js"></script>
</body>
</html>
